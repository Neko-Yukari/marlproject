# ExplabOff Configuration - 3ES-7MD
name: "explaboff_3es7md"

environment:
  num_md: 7
  num_es: 3
  randomize_profile: true
  profile_noise: 0.05

algorithm:
  type: "ExplabOff"
  hidden_dim: 128
  lr: 5.0e-5
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coeff: 0.01
  mi_mu: 0.01
  mi_nu: 0.01

training:
  episodes: 20000
  log_interval: 1000
  update_every: 500
  batch_size: 4096
  num_epochs: 10
  lr_step: 5000
  lr_gamma: 0.5
