# MARL Edge Offloading — Stage 1 Default Configuration
# IPPO Baseline (No Communication)

# --- Environment ---
environment:
  num_devices: 5
  num_servers: 3
  max_slots: 100
  device_cpu: 1.0e9
  server_cpu: 7.0e9
  energy_budget: 100.0
  tx_power: 0.1
  bandwidth: 10.0e6
  noise_power: 1.0e-11
  energy_coeff: 1.0e-28
  cost_weight: 0.5
  data_range: [1.0e5, 1.0e6]
  cpu_per_bit: 1000.0
  latency_range: [0.1, 0.5]

# --- MARL Settings ---
marl:
  algorithm: "IPPO"
  total_episodes: 1000
  episode_length: 100
  num_agents: 5

# --- PPO Algorithm ---
algorithm:
  type: "IPPO"
  hidden_dim: 128
  num_layers: 2
  learning_rate: 5.0e-5
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coeff: 0.01
  value_coeff: 0.5
  max_grad_norm: 0.5
  batch_size: 64
  num_epochs: 4

# --- Reward Shaping ---
reward:
  cost_weight: 0.5
  deadline_penalty: 10.0
  energy_penalty: 10.0

# --- Evaluation ---
evaluation:
  eval_episodes: 10
  save_interval: 100

# --- Logging ---
logging:
  log_dir: "./logs"
  tensorboard_dir: "./runs"
  checkpoint_dir: "./checkpoints"

# --- Random Seed ---
seed: 42
