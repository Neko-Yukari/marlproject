# IPPO Configuration - 2ES-3MD
name: "ippo_2es3md"

environment:
  num_md: 3
  num_es: 2
  randomize_profile: true
  profile_noise: 0.05

algorithm:
  type: "IPPO"
  hidden_dim: 128
  lr: 5.0e-5
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coeff: 0.01

training:
  episodes: 20000
  log_interval: 1000
  update_every: 500
  batch_size: 4096
  num_epochs: 10
  lr_step: 5000
  lr_gamma: 0.5
