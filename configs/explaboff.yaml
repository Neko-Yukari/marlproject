# MARL Edge Offloading — Stage 2 ExplabOff Configuration
# Mutual Information-Enhanced MARL (INFOCOM 2025)

# Inherits from default.yaml, with MI-specific additions.

# --- Environment (same as Stage 1) ---
environment:
  num_devices: 5
  num_servers: 3
  max_slots: 100
  device_cpu: 1.0e9
  server_cpu: 7.0e9
  energy_budget: 100.0
  tx_power: 0.1
  bandwidth: 10.0e6
  noise_power: 1.0e-11
  energy_coeff: 1.0e-28
  cost_weight: 0.5

# --- MARL Settings ---
marl:
  algorithm: "ExplabOff"
  total_episodes: 1000
  episode_length: 100
  num_agents: 5

# --- ExplabOff Algorithm ---
algorithm:
  type: "ExplabOff"
  hidden_dim: 128
  num_layers: 2
  learning_rate: 5.0e-5
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coeff: 0.01
  value_coeff: 0.5
  max_grad_norm: 0.5
  batch_size: 64
  num_epochs: 4

  # MI-specific
  mi_weight_mu: 0.01        # InfoNCE lower bound weight
  mi_weight_nu: 0.01        # L1Out upper bound weight
  mi_estimator: "InfoNCE+L1Out"
  info_nce_K: 32            # Negative samples for InfoNCE
  superior_buffer_size: 1000
  inferior_buffer_size: 1000

# --- Reward Shaping ---
reward:
  cost_weight: 0.5
  deadline_penalty: 10.0
  energy_penalty: 10.0

# --- Evaluation ---
evaluation:
  eval_episodes: 10
  save_interval: 100

# --- Logging ---
logging:
  log_dir: "./logs"
  tensorboard_dir: "./runs"
  checkpoint_dir: "./checkpoints"

seed: 42
