# Quick Test Configuration
name: "ippo_test"

environment:
  num_md: 3
  num_es: 2
  randomize_profile: true
  profile_noise: 0.05

algorithm:
  type: "IPPO"
  hidden_dim: 64
  lr: 5.0e-5
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coeff: 0.01

training:
  episodes: 100
  log_interval: 20
  update_every: 50
  batch_size: 256
  num_epochs: 5
  lr_step: 1000
  lr_gamma: 0.5
