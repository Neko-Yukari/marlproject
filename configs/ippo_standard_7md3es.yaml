# IPPO + Standard Network on 3ES-7MD
# Generated by config system

network:
  type: standard
  hidden_dim: 128
  num_layers: 2

algorithm:
  name: ippo
  use_mi: false
  lr: 0.00005
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coeff: 0.01
  value_coeff: 0.5
  max_grad_norm: 0.5
  update_every: 100
  num_epochs: 4
  batch_size: 128

environment:
  name: paper_accurate_env
  num_md: 7
  num_es: 3
  slots: 10
  randomize_profile: true
  profile_noise: 0.05

training:
  num_episodes: 10000
  log_interval: 100
  seed: 42

device: cuda
